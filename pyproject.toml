[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-mesh"
version = "0.1.0"
description = "A citation-backed multi-agent research assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0,<2",
    "httpx>=0.27,<1",
    "ollama>=0.3,<1",
    "pydantic>=2.8,<3",
    "pypdf>=5.0,<6",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/research_mesh"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "chromadb.*"
ignore_missing_imports = true
